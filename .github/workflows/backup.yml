name: Backup and keep-alive

# Every 3 days: pings Supabase (free projects pause after 7 days without activity)
# and stores an encrypted pg_dump as a run artifact for 90 days.
# Restore procedure: README.md > "Restaurer une sauvegarde".

on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Keep the Supabase project awake
        run: |
          curl --fail --silent --show-error --max-time 30 \
            -H "apikey: $SUPABASE_KEY" "$SUPABASE_URL/auth/v1/health"

      - name: Check backup secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::warning::SUPABASE_DB_URL or BACKUP_PASSPHRASE is missing: backup skipped (see README)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the PostgreSQL client matching the server
        if: steps.secrets.outputs.ready == 'true'
        run: |
          major=$(psql "$SUPABASE_DB_URL" -tAc 'show server_version_num' | cut -c1-2)
          echo "Server major version: $major"
          sudo apt-get install -y -qq postgresql-common > /dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          sudo apt-get install -y -qq "postgresql-client-$major" > /dev/null
          echo "PG_BIN=/usr/lib/postgresql/$major/bin" >> "$GITHUB_ENV"

      - name: Dump and encrypt
        if: steps.secrets.outputs.ready == 'true'
        run: |
          umask 077
          mkdir dump
          # Application schemas: tables, data, functions, policies and grants.
          "$PG_BIN/pg_dump" "$SUPABASE_DB_URL" --schema=public --schema=private \
            --no-owner --file=dump/app.sql
          # Login accounts, needed to keep participants linked after a restore.
          "$PG_BIN/pg_dump" "$SUPABASE_DB_URL" --data-only \
            --table=auth.users --table=auth.identities --file=dump/auth.sql
          name="padel-tricount-$(date -u +%Y-%m-%d)"
          tar czf - -C dump . | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-file <(printf '%s' "$BACKUP_PASSPHRASE") \
            --symmetric --cipher-algo AES256 --output "$name.tar.gz.gpg"
          rm -rf dump
          echo "BACKUP_NAME=$name" >> "$GITHUB_ENV"
          ls -l "$name.tar.gz.gpg"

      - name: Store the encrypted backup
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BACKUP_NAME }}
          path: ${{ env.BACKUP_NAME }}.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error
